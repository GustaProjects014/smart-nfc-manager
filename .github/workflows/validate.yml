name: Validate NFC Control

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build application
        run: bun run build
      - name: Format changed NFC Control screens
        run: |
          bunx prettier --write \
            'src/routes/_authenticated/painel.tsx' \
            'src/routes/_authenticated/estoque.tsx' \
            'src/routes/_authenticated/plaquinhas.tsx' \
            'src/routes/_authenticated/plaquinhas.$plateId.tsx' \
            'src/routes/_authenticated/qrcodes.tsx' \
            'src/routes/r.$slug.tsx' \
            'src/routes/_authenticated/clientes.tsx' \
            'src/routes/_authenticated/vendas.tsx' \
            'src/routes/_authenticated/financeiro.tsx' \
            'src/routes/_authenticated/configuracoes.tsx' \
            'src/routes/_authenticated/revendedores.tsx' \
            'src/routes/_authenticated/relatorios.tsx' \
            'src/styles.css'
      - name: Check whitespace
        run: git diff --check
      - name: Commit formatting changes
        if: github.event_name == 'push'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "style: format NFC Control screens"
